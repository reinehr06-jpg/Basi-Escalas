services:
  frontend:
    image: basileia-frontend:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dexos_basileia_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=/api
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - dexos_basileia

networks:
  dexos_basileia:
    name: dexos_basileia
    external: true
