services:
  mongo:
    image: mongo:8
    container_name: basi_escalas_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - basi_escalas

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: basi-escalas-backend:dev
    container_name: basi_escalas_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Basi Escalas"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_TIMEZONE: America/Sao_Paulo
      DB_CONNECTION: mongodb
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: basi_escalas
      FRONTEND_URL: http://localhost:3000
      SANCTUM_STATEFUL_DOMAINS: localhost:3000
      # auto: popula só quando o banco está vazio. Outros valores: always, never.
      DB_SEED: auto
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - basi_escalas

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: basi-escalas-frontend:dev
    container_name: basi_escalas_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      # Lido pelo navegador, por isso localhost e não o nome do serviço.
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    networks:
      - basi_escalas

volumes:
  # Nome fixo: o compose adota o volume se ele já existir e cria se não existir,
  # então os dados sobrevivem a um `down` e a uma troca de pasta do projeto.
  mongo_data:
    name: basi_escalas_mongo_data
  backend_vendor:
  frontend_node_modules:
  frontend_next:

networks:
  basi_escalas:
    name: basi_escalas
